spring:
  application:
    name: horizon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/horizon}
    username: ${DB_USER:${USER:postgres}}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # dev and test only; staging and production override to validate when Flyway lands
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# forward-headers-strategy is intentionally unset: it must be decided together with the auth plan
# (X-Forwarded-For trust) — do not enable it while the API port is directly reachable, a client could spoof the header
server:
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs

horizon:
  idempotency:
    lock-timeout: PT60S
    retention: PT48H
  purge:
    batch-size: 500
    cron: "0 */10 * * * *"
  rate-limit:
    sweep-interval-ms: 300000
  auth:
    jwt-secret: ${HORIZON_JWT_SECRET}
    jwt-kid: ${HORIZON_JWT_KID:k1}
    issuer: horizon
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-pepper: ${HORIZON_OTP_PEPPER}
  security:
    encryption-key: ${HORIZON_ENCRYPTION_KEY}
    # Trust the first X-Forwarded-For hop only when the API is reachable through the Next.js proxy alone.
    # Leave false anywhere the API port can be reached directly, or a client can spoof its IP and
    # defeat the login and OTP limits. Local development turns it on (docs/local-setup.md).
    trust-forwarded-for: false
